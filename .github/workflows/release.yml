name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      publish_apt:
        description: Publish built debs to the XGC2 APT repository
        required: true
        default: false
        type: boolean
      run_cpp_quality:
        description: Run clang-format and clang-tidy checks
        required: true
        default: false
        type: boolean
      run_source_tests:
        description: Run source-tree catkin tests before Docker deb builds
        required: true
        default: false
        type: boolean
      release_id:
        description: Parent orchestrator run id used for correlation and audit
        required: false
        default: ""
        type: string
      release_lock_digest:
        description: SHA256 of the immutable release lock
        required: false
        default: ""
        type: string
      trusted_ci_run_id:
        description: Exact successful push CI run whose trusted deb artifacts may be reused
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-release-inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate expected version and source SHA
        run: |
          set -euo pipefail
          actual_version="$(awk -F': *' '/^version:[[:space:]]*/ {print $2; exit}' .xgc2/product.yml)"
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_version}" = "${{ inputs.expected_version }}"
          test "${actual_sha}" = "${{ inputs.expected_source_sha }}"

  package-compliance:
    name: Package compliance
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata
        run: |
          git diff --check HEAD
          python3 .xgc2/scripts/check_param_contract.py

  cpp-quality:
    name: C++ quality
    if: ${{ inputs.run_cpp_quality }}
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    steps:
      - name: Install checkout dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v4

      - name: Install quality dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          echo "deb [trusted=yes arch=$(dpkg --print-architecture)] https://xgc2.apt.xiaokang.ink focal main" \
            > /etc/apt/sources.list.d/xgc2.list
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            clang-format \
            clang-tidy \
            cmake \
            git \
            libxgc2-math-dev \
            libxgc2-state-machine-dev \
            rsync \
            ros-noetic-geometry-msgs \
            ros-noetic-mavros-msgs \
            ros-noetic-message-generation \
            ros-noetic-roscpp \
            ros-noetic-rostest \
            ros-noetic-xgc2-estimator-hover-thrust-msgs \
            ros-noetic-xgc2-ros1-utils \
            ros-noetic-xgc2-state-machine-msgs \
            ros-noetic-sensor-msgs \
            ros-noetic-std-msgs

      - name: Run C++ quality gate
        run: .xgc2/scripts/check_cpp_quality.sh

  source-tests:
    name: Source build and tests
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    steps:
      - name: Skip source tests
        if: ${{ !inputs.run_source_tests }}
        run: echo "Source tests disabled by input"

      - name: Install checkout dependencies
        if: inputs.run_source_tests
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v4
        if: inputs.run_source_tests
        with:
          fetch-depth: 2

      - name: Install build dependencies
        if: inputs.run_source_tests
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          echo "deb [trusted=yes arch=$(dpkg --print-architecture)] https://xgc2.apt.xiaokang.ink focal main" \
            > /etc/apt/sources.list.d/xgc2.list
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            libxgc2-math-dev \
            libxgc2-state-machine-dev \
            rsync \
            ros-noetic-geometry-msgs \
            ros-noetic-mavros-msgs \
            ros-noetic-message-generation \
            ros-noetic-roscpp \
            ros-noetic-roslaunch \
            ros-noetic-rospack \
            ros-noetic-rostest \
            ros-noetic-xgc2-estimator-hover-thrust-msgs \
            ros-noetic-xgc2-ros1-utils \
            ros-noetic-xgc2-state-machine-msgs \
            ros-noetic-sensor-msgs \
            ros-noetic-std-msgs

      - name: Check package metadata
        if: inputs.run_source_tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --check HEAD
          python3 .xgc2/scripts/check_param_contract.py

      - name: Build package and run launch compliance
        if: inputs.run_source_tests
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP}/estimator-hover-thrust-compliance"
          install_root="${RUNNER_TEMP}/estimator-hover-thrust-install-root"
          rm -rf "$work_dir" "$install_root"
          mkdir -p "$work_dir/src/hover-thrust"
          rsync -a --delete "$GITHUB_WORKSPACE/" "$work_dir/src/hover-thrust/"

          cd "$work_dir"
          set +u
          source /opt/ros/noetic/setup.bash
          set -u
          catkin_make run_tests_hover_thrust_estimator
          catkin_test_results
          DESTDIR="$install_root" catkin_make install \
            -DCMAKE_INSTALL_PREFIX=/opt/ros/noetic \
            -DCMAKE_BUILD_TYPE=Release
          "$GITHUB_WORKSPACE/.xgc2/scripts/check_core_libraries.sh" --install-root "$install_root"
          set +u
          source devel/setup.bash
          set -u
          test "$(rospack find hover_thrust_estimator)" = "$work_dir/src/hover-thrust/hover_thrust_estimator"
          test "$(rospack find hover_thrust_estimator_msgs)" = "/opt/ros/noetic/share/hover_thrust_estimator_msgs"
          roslaunch --files hover_thrust_estimator hover_thrust_estimator.launch >/tmp/xgc2-hover-thrust-estimator-files.txt

  build-debs:
    name: Build debs (${{ matrix.arch }})
    needs: validate-release-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download trusted CI artifacts
        if: ${{ inputs.trusted_ci_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.trusted_ci_run_id }}
          name: xgc2-estimator-hover-thrust-debs-${{ matrix.arch }}
          path: trusted

      - name: Verify and stage trusted CI artifacts
        if: ${{ inputs.trusted_ci_run_id != '' }}
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
            --artifact-dir trusted \
            --deb-output-dir debs \
            --manifest-output-dir build-manifests \
            --product xgc2-estimator-hover-thrust \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "${{ inputs.trusted_ci_run_id }}"

      - name: Build and install-check deb package in Docker
        if: ${{ inputs.trusted_ci_run_id == '' }}
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/estimator-hover-thrust-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create fallback build manifest
        if: ${{ inputs.trusted_ci_run_id == '' }}
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir build-manifests \
            --product xgc2-estimator-hover-thrust \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-estimator-hover-thrust-debs-${{ matrix.arch }}
          path: |
            debs/*.deb
            build-manifests/*.json
          retention-days: 14
          include-hidden-files: true

  publish-apt:
    name: Publish APT
    if: >-
      ${{
        always() &&
        inputs.publish_apt &&
        needs.validate-release-inputs.result == 'success' &&
        needs.package-compliance.result == 'success' &&
        (needs.cpp-quality.result == 'success' || needs.cpp-quality.result == 'skipped') &&
        (needs.source-tests.result == 'success' || needs.source-tests.result == 'skipped') &&
        needs.build-debs.result == 'success'
      }}
    needs:
      - validate-release-inputs
      - package-compliance
      - cpp-quality
      - source-tests
      - build-debs
    runs-on: ubuntu-latest
    concurrency:
      group: xgc2-apt-focal
      cancel-in-progress: false
    env:
      APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
      APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
      APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
      APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}
      APT_REPO_DISTRIBUTION: focal
    steps:
      - uses: actions/checkout@v4

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xgc2-estimator-hover-thrust-debs-*
          path: release-input
          merge-multiple: true

      - name: Validate artifacts and create release manifests
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
            --artifact-dir release-input \
            --deb-output-dir staged/debs \
            --manifest-output-dir staged/build-manifests \
            --product xgc2-estimator-hover-thrust \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --source-sha "${{ inputs.expected_source_sha }}"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py release \
            --deb-dir staged/debs \
            --build-manifest-dir staged/build-manifests \
            --publish-dir publish \
            --product xgc2-estimator-hover-thrust \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --release-id "${{ inputs.release_id || github.run_id }}" \
            --release-lock-digest "${{ inputs.release_lock_digest }}" \
            --target-architecture amd64 \
            --target-architecture arm64

      - name: Publish to self-hosted APT repository
        if: ${{ env.APT_REPO_HOST != '' && env.APT_REPO_PORT != '' && env.APT_REPO_SSH_KEY != '' && env.APT_REPO_KNOWN_HOSTS != '' }}
        run: .xgc2/scripts/publish_apt_repo.sh --deb-dir publish
