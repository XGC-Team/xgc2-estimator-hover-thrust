schema: xgc2.product.v1
id: xgc2-estimator-hover-thrust
name: XGC2 Hover Thrust Estimator
version: 1.1.24-14
kind: ros1-apt
summary: Hover thrust estimation package for PX4/MAVROS UAV controllers.
ros:
  distro: noetic
  packages:
  - hover_thrust_estimator
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-estimator-hover-thrust
  packages:
  - ros-noetic-xgc2-estimator-hover-thrust
  depends:
  - libxgc2-math-dev (>= 0.5.6-6~focal)
  - libxgc2-state-machine-dev (>= 0.1.3-4~focal)
  - ros-noetic-xgc2-ros1-utils (>= 1.1.1-3)
  - ros-noetic-xgc2-state-machine-msgs (>= 1.2.0-3)
  - ros-noetic-xgc2-estimator-hover-thrust-msgs (>= 1.2.0-3)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-estimator-hover-thrust

    '
  smoke_test: 'roslaunch --files hover_thrust_estimator hover_thrust_estimator.launch

    '
ownership:
  paths:
  - /opt/ros/noetic/share/hover_thrust_estimator
  - /opt/ros/noetic/include/hover_thrust_estimator
  - /opt/ros/noetic/lib/hover_thrust_estimator
  - /opt/ros/noetic/lib/libhover_thrust_estimator_math.so
  - /opt/ros/noetic/lib/libhover_thrust_estimator_core.so
release:
  dependency_policy:
    libxgc2-math-dev: rebuild
    libxgc2-state-machine-dev: rebuild
    xgc2-ros-msgs: rebuild
    xgc2-ros1-utils: rebuild
  apt_versions:
    focal: 1.1.24-14
