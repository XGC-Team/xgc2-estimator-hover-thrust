schema: xgc2.product.v1
id: xgc2-estimator-hover-thrust
name: XGC2 Hover Thrust Estimator
kind: ros1-apt
summary: Hover thrust estimation package for PX4/MAVROS UAV controllers.

ros:
  distro: noetic
  packages:
    - hover_thrust_estimator

apt:
  distribution: focal
  install:
    - ros-noetic-xgc2-estimator-hover-thrust
  packages:
    - ros-noetic-xgc2-estimator-hover-thrust

usage:
  install: |
    sudo apt update
    sudo apt install ros-noetic-xgc2-estimator-hover-thrust
  smoke_test: |
    roslaunch --files hover_thrust_estimator hover_thrust_estimator.launch

ownership:
  paths:
    - /opt/ros/noetic/share/hover_thrust_estimator
    - /opt/ros/noetic/include/hover_thrust_estimator
    - /opt/ros/noetic/lib/hover_thrust_estimator
    - /opt/ros/noetic/lib/libhover_thrust_estimator_core.so
